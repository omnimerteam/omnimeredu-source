name: CI/CD with GHCR and VPS

on:
  push:
    branches: [ "ci/cd" ]   # mỗi lần push ci/cd thì build + deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # sẽ thành ghcr.io/<user>/<repo>:tag

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # cần quyền push lên GHCR
      id-token: write

    steps:
      # Lấy code từ repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Docker buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login vào GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build và push image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔑 Login vào GHCR"
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "⬇️ Pull image mới"
            docker pull ghcr.io/${{ github.repository }}:latest

            echo "🚀 Restart bằng docker-compose"
            cd /var/www/omnimeredu-app
            docker compose up -d
            docker compose down
